[package]
name = "patina"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[[test]]
name = "compiletest"
path = "tests/compiletest/main.rs"
harness = false

[dependencies]
rustc_lexer = { path = "rust/compiler/rustc_lexer" }
rustc_parse = { path = "rust/compiler/rustc_parse" }
rustc_expand = { path = "rust/compiler/rustc_expand" }
rustc_resolve = { path = "rust/compiler/rustc_resolve" }
rustc_span = { path = "rust/compiler/rustc_span" }
rustc_session = { path = "rust/compiler/rustc_session" }
rustc_arena = { path = "rust/compiler/rustc_arena" }
rustc_ast = { path = "rust/compiler/rustc_ast" }
rustc_ast_pretty = { path = "rust/compiler/rustc_ast_pretty" }
rustc_abi = { path = "rust/compiler/rustc_abi" }
rustc_errors = { path = "rust/compiler/rustc_errors" }
rustc_data_structures = { path = "rust/compiler/rustc_data_structures" }
rustc_feature = { path = "rust/compiler/rustc_feature" }
rustc_fs_util = { path = "rust/compiler/rustc_fs_util" }
rustc_hir = { path = "rust/compiler/rustc_hir" }
rustc_index = { path = "rust/compiler/rustc_index" }
rustc_middle = { path = "rust/compiler/rustc_middle" }
rustc_query_impl = { path = "rust/compiler/rustc_query_impl" }
rustc_interface = { path = "rust/compiler/rustc_interface" }
rustc_hir_pretty = { path = "rust/compiler/rustc_hir_pretty" }
rustc_incremental = { path = "rust/compiler/rustc_incremental" }
rustc_metadata = { path = "rust/compiler/rustc_metadata" }

etf = { path = "rust/compiler/etf" }

clap = { version = "4.6.1", features = ["derive", "env", "unicode", "wrap_help"] }
indexmap = { version = "2.14.0", features = ["serde"] }
num-bigint = "0.4.6"
serde = { version = "1.0.228", features = ["derive"] }
serde-untagged = "0.1.9"
serde_json = "1.0.150"
tempfile = "3.27.0"
thiserror = "2.0.18"
toml = { version = "1.2.0", features = ["preserve_order"] }

[dev-dependencies]
anyhow = "1.0.102"
libtest-mimic = "0.8.2"
similar = "3.1.1"
walkdir = "2.5.0"

[profile.dev.package.microlp]
# microlp gains a lot from optimization
opt-level = 3
